[metadata]
format.version = "1.1"

[versions]
edc = "1.0.0-RC1"
edc-build = "1.5.2"
shadow = "9.6.1"
docker = "9.4.0"

[libraries]

edc-bom-controlplane={ module = "org.eclipse.edc:controlplane-base-bom", version.ref = "edc" }
edc-iam-mock = { module = "org.eclipse.edc:iam-mock", version.ref = "edc" }
edc-spi-boot = { module = "org.eclipse.edc:boot-spi", version.ref = "edc" }
edc-spi-dp = { module = "org.eclipse.edc:data-plane-spi", version.ref ="edc"}
edc-spi-web = { module = "org.eclipse.edc:web-spi", version.ref ="edc"}
edc-bom-virtual-controlplane = { module = "org.eclipse.edc:controlplane-virtual-base-bom", version.ref = "edc" }
edc-core-manager-negotiation = { module = "org.eclipse.edc:control-plane-contract-manager", version.ref = "edc" }
edc-core-manager-transfer = { module = "org.eclipse.edc:control-plane-transfer-manager", version.ref = "edc" }
edc-api-secrets = { module = "org.eclipse.edc:secrets-api", version.ref = "edc" }

[plugins]
edc-build = { id = "org.eclipse.edc.edc-build", version.ref = "edc-build" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
docker = { id = "com.bmuschko.docker-remote-api", version.ref = "docker" }
